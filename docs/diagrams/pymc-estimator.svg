<text x="150" y="24.0" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start">How PyMC is used  —  Agent 2 (Estimator)</text>
<text x="195" y="51.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#757575" text-anchor="start">agents/ranker.py - masked two-component Bayesian mixture, NUTS</text>
<text x="175.0" y="112.1" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">INPUTS from Cognee</text>
<text x="175.0" y="130.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">(written by the Detector)</text>
<text x="175.0" y="149.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">X = signals that fired</text>
<text x="175.0" y="168.4" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">M = applicability mask</text>
<text x="550.0" y="102.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">PRIORS</text>
<text x="550.0" y="121.5" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">pi ~ Beta(1,9)  (mules are rare)</text>
<text x="550.0" y="140.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">phi_mule ~ Beta(4,1)</text>
<text x="550.0" y="159.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">phi_legit ~ Beta(1,4)</text>
<text x="550.0" y="177.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">fire-rates are LEARNED by the sampler</text>
<text x="300" y="211.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8b5cf6" text-anchor="start">THE KEY LINE</text>
<text x="380.0" y="257.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">MASKED LIKELIHOOD  (per account, per class k)</text>
<text x="380.0" y="276.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">ll_k = sum( M * [ X*log(phi_k) + (1-X)*log(1-phi_k) ] )</text>
<text x="730.0" y="207.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle">KEY: M zeroes</text>
<text x="730.0" y="223.8" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle">signals that</text>
<text x="730.0" y="240.1" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle">CANNOT fire -&gt;</text>
<text x="730.0" y="256.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle">treated as</text>
<text x="730.0" y="272.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle">missing, not as</text>
<text x="730.0" y="288.8" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle">innocence (sinks</text>
<text x="730.0" y="305.1" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle">stay confident,</text>
<text x="730.0" y="321.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle">AC-0012 stays</text>
<text x="730.0" y="337.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle">uncertain)</text>
<text x="380.0" y="386.5" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">MIXTURE  via  pm.Potential</text>
<text x="380.0" y="405.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">log_mix = [ log(pi)+ll_mule ,  log(1-pi)+ll_legit ]</text>
<text x="380.0" y="424.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">Potential = sum( logsumexp(log_mix) )</text>
<text x="730.0" y="365.9" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle">logsumexp</text>
<text x="730.0" y="382.2" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle">marginalizes the</text>
<text x="730.0" y="398.4" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle">hidden class out</text>
<text x="730.0" y="414.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle">-&gt; smooth</text>
<text x="730.0" y="430.9" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle">gradient, so NUTS</text>
<text x="730.0" y="447.2" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle">can sample it</text>
<text x="380.0" y="518.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">pm.sample( NUTS / nutpie,</text>
<text x="380.0" y="537.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">4 chains )</text>
<text x="380.0" y="630.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">theta = P(mule | signals)  per account</text>
<text x="380.0" y="649.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">FULL posterior, not a point estimate</text>
<text x="237.5" y="750.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">p_mule</text>
<text x="237.5" y="769.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">= posterior mean</text>
<text x="522.5" y="750.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">94% credible interval</text>
<text x="522.5" y="769.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">(_hdi94)</text>
<text x="385.0" y="850.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">accreted onto the Case node in Cognee  -&gt;  Agent 3</text>
<text x="385.0" y="869.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle">(Adjudicator)</text>
</svg>