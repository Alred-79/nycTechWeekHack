[project]
name = "hackathon-techweek"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "arviz>=1.1.0",
    "cognee>=1.1.2",
    "duckdb>=1.5.3",
    "groq>=1.4.0",
    "matplotlib>=3.10.9",
    "nutpie>=0.16.10",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "pymc>=6.0.1",
    "python-dotenv>=1.2.2",
    "streamlit>=1.58.0",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
